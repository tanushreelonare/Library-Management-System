<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>

        Update Password

    </title>

    <link
            rel="stylesheet"
            th:href="@{/css/common.css}">

    <link
            rel="stylesheet"
            th:href="@{/css/password.css}">

</head>

<body>

<!-- PUBLIC HEADER -->

<div
        th:replace="~{fragments/public-header :: header}">
</div>

<!-- BREADCRUMB -->

<div class="breadcrumb">

    <a th:href="@{/}">

        Home

    </a>

    <span class="separator">

        >

    </span>

    <a th:href="@{/login}">

        Login

    </a>

    <span class="separator">

        >

    </span>

    <a th:href="@{/forgot-password}">

        Forgot Password

    </a>

    <span class="separator">

        >

    </span>

    <span>

        Update Password

    </span>

</div>

<!-- PAGE HEADER -->

<div class="page-header">

    <div>

        <h1>

            Update Password

        </h1>

        <p>

            Create a new password for your LMS account.

        </p>

    </div>

</div>

<!-- PASSWORD CONTAINER -->

<div class="password-container">

    <form
            id="updatePasswordForm"
            method="post"
            th:action="@{/update-password}"
            novalidate>

        <!-- REGISTERED EMAIL -->

        <input
                type="hidden"
                name="email"
                th:value="${email}">

        <div class="password-card">

            <h2>

                Create New Password

            </h2>

            <p class="card-description">

                Your new password must be at least 8 characters long.

            </p>

            <!-- ERROR MESSAGE -->

            <div
                    th:if="${errorMessage}"
                    class="error-message">

                <span th:text="${errorMessage}">

                </span>

            </div>

            <!-- PASSWORD ROW -->

            <div class="form-row">

                <!-- NEW PASSWORD -->

                <div class="form-group">

                    <label for="password">

                        New Password

                    </label>

                    <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter New Password"
                            autocomplete="new-password"
                            required>

                    <small
                            id="passwordError"
                            class="error-message">

                    </small>

                </div>

                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">

                        Confirm Password

                    </label>

                    <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm New Password"
                            autocomplete="new-password"
                            required>

                    <small
                            id="confirmPasswordError"
                            class="error-message">

                    </small>

                </div>

            </div>

            <!-- SHOW PASSWORD -->

            <div class="show-password-container">

                <label class="checkbox-label">

                    <input
                            type="checkbox"
                            id="showPassword">

                    Show Password

                </label>

            </div>

            <!-- BUTTONS -->

            <div class="button-row">

                <button
                        type="submit"
                        class="btn primary-btn">

                    Update Password

                </button>

                <button
                        type="reset"
                        class="btn secondary-btn">

                    Reset

                </button>

                <a
                        th:href="@{/login}"
                        class="btn secondary-btn">

                    Back to Login

                </a>

            </div>

            <hr class="divider">

            <div class="info-box">

                <p>

                    <strong>Security Note:</strong>

                    Your new password will be securely encrypted before
                    being stored in the database.

                </p>

            </div>

        </div>

    </form>

</div>

<!-- FOOTER -->

<div
        th:replace="~{fragments/footer :: footer}">
</div>

<!-- JAVASCRIPT -->

<script th:src="@{/js/common.js}"></script>

<script th:src="@{/js/password.js}"></script>

</body>

</html>
