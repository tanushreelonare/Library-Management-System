<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>

        Forgot Password

    </title>

    <link
            rel="stylesheet"
            th:href="@{/css/common.css}">

    <link
            rel="stylesheet"
            th:href="@{/css/password.css}">

</head>

<body>

<!-- PUBLIC HEADER -->

<div
        th:replace="~{fragments/public-header :: header}">
</div>

<!-- BREADCRUMB -->

<div class="breadcrumb">

    <a th:href="@{/}">

        Home

    </a>

    <span class="separator">

        >

    </span>

    <a th:href="@{/login}">

        Login

    </a>

    <span class="separator">

        >

    </span>

    <span>

        Forgot Password

    </span>

</div>

<!-- PAGE HEADER -->

<div class="page-header">

    <div>

        <h1>

            Forgot Password

        </h1>

        <p>

            Enter your registered email address to continue.

        </p>

    </div>

</div>

<!-- PASSWORD CONTAINER -->

<div class="password-container">

    <form
            id="forgotPasswordForm"
            method="post"
            th:action="@{/forgot-password}"
            novalidate>

        <div class="password-card">

            <h2>

                Reset Password

            </h2>

            <p class="card-description">

                Verify your account before resetting your password.

            </p>

            <!-- ERROR MESSAGE -->

            <div
                    th:if="${errorMessage}"
                    class="error-message">

                <span th:text="${errorMessage}">

                </span>

            </div>

            <!-- SUCCESS MESSAGE -->

            <div
                    th:if="${successMessage}"
                    class="success-message">

                <span th:text="${successMessage}">

                </span>

            </div>

            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">

                    Registered Email Address

                </label>

                <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter Registered Email Address"
                        autocomplete="email"
                        required>

                <small
                        id="emailError"
                        class="error-message">

                </small>

            </div>

            <!-- BUTTONS -->

            <div class="button-row">

                <button
                        type="submit"
                        class="btn primary-btn">

                    Continue

                </button>

                <a
                        th:href="@{/login}"
                        class="btn secondary-btn">

                    Back to Login

                </a>

            </div>

            <hr class="divider">

            <div class="info-box">

                <p>

                    <strong>Note:</strong>

                    Enter the email address associated with your
                    Student or Librarian account.

                </p>

            </div>

        </div>

    </form>

</div>

<!-- FOOTER -->

<div
        th:replace="~{fragments/footer :: footer}">
</div>

<!-- JAVASCRIPT -->

<script th:src="@{/js/common.js}"></script>

<script th:src="@{/js/password.js}"></script>

</body>

</html>
